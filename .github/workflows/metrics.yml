# 依赖开源项目 https://github.com/lowlighter/metrics
# 用户名已改为 ${{ github.repository_owner }}，无需手填。
# 需要的 Secret：METRICS_TOKEN（classic PAT，勾选 repo + read:user）
#
# ⚠️ 2026-10-10 排查记录 —— 有 3 个图表会渲染出「Unexpected error」红框，已停用。
#    根因是上游插件与 GitHub API 变更不兼容，不是配置写错（token 权限、仓库设置都正常）：
#      · 成就   achievements  查询里带 `projects`（Projects classic）字段，GitHub 已废弃该字段并直接返回错误，
#                            导致整个 GraphQL 请求失败（achievements/queries/achievements.graphql 第 50 行）
#      · 最近动态 activity    插件读 `payload.commits`，而 GitHub 事件 API 现在返回的 PushEvent 已不含该字段
#                            （实测 torvalds / lowlighter 的 PushEvent 也全部没有 commits），插件内部直接 TypeError
#      · 编码习惯 habits     同上，同一个 `payload.commits` 缺失导致 TypeError: Cannot destructure 'author'
#    这三段配置保留在文件末尾（已注释），上游修好后取消注释即可恢复。
#
#    另外删掉的两个（不是报错，是没数据可显示）：
#      · 置顶仓库 repositories.pinned  需要显式配置要展示的仓库，且置顶仓库只能选公开仓库
#      · 讨论区   discussions          仓库没开 Discussions，全是 0

name: GitHub Metrics

on:
  schedule:
    - cron: "13 0 * * *" # 每天 UTC 00:13 = 北京时间 08:13（避开整点拥堵，整点 schedule 易被延迟）
  workflow_dispatch:

# 2023-02 之后新建的仓库，GITHUB_TOKEN 默认只读，必须显式声明写权限，否则提交会 403
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ---------- 基础信息（含几个小插件） ----------
      - name: base
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"
          plugin_traffic: yes # 🧮 Repositories traffic
          plugin_lines: yes # 👨‍💻 Lines of code changed
          plugin_introduction: yes # 🙋 Introduction
          plugin_gists: yes # 🎫 Gists

      # ---------- 📅 等距提交日历（整年） ----------
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------- 🈷️ 语言统计 ----------
      # 用标准模式（不 clone 仓库，直接读 GitHub 的语言元数据），比 indepth 模式快且不容易超时
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # ---------- ✨ Stargazers ----------
      - name: Using chartist charts
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/stargazers.chartist.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

      # ---------- 🌟 最近 Star 的仓库 ----------
      - name: Recently starred
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 10

      # ---------- 🎟️ Issue / PR 跟进 ----------
      - name: Follow-up
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/followup.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes

      # ---------- 🎭 评论表情反应 ----------
      - name: Comment reactions
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage

      # ---------- 🧑‍🤝‍🧑 关注者头像 ----------
      - name: Followers
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/people.followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_limit: 300
          plugin_people_size: 36
          plugin_people_types: followers, following

      # ---------- 📆 提交日历（全历史） ----------
      - name: Full history calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      # ================================================================
      # 以下 3 段暂不启用：上游插件与 GitHub API 变更不兼容，会输出
      # 「Unexpected error」红框。等 lowlighter/metrics 修复后取消注释即可恢复。
      # ================================================================

      # ---------- 🏆 成就（停用：查询引用已废弃的 Projects classic 字段） ----------

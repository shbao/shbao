# 依赖开源项目 https://github.com/yoshi389111/github-profile-3d-contrib
# 作用：生成 3D 立体贡献图
# 用户名用 ${{ github.repository_owner }} 自动获取，无需手填

name: 3D Contrib

on:
  schedule:
    - cron: "40 0 * * *" # 每天 UTC 00:40 = 北京时间 08:40（错开 metrics 00:00 / snake 00:20）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 下面用 git pull --rebase，需要完整历史才可靠
      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated" || echo "no changes to commit"
          # 多条 workflow 可能同时提交，push 被拒时先 rebase 再重试
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push 成功（第 $i 次尝试）"
              exit 0
            fi
            echo "push 第 $i 次失败，5 秒后重试 ..."
            sleep 5
          done
          echo "::error::push 连续 3 次失败"
          exit 1

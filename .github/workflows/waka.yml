# 依赖开源项目 https://github.com/anmol098/waka-readme-stats
# 作用：把 WakaTime 统计直接写进 README.md 的 <!--START_SECTION:waka--> ... <!--END_SECTION:waka--> 之间
# 需要的 Secret：WAKATIME_API_KEY、GH_TOKEN

name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOCALE: zh
          SHOW_LINES_OF_CODE: "True" # 代码总行数
          SHOW_LOC_CHART: "True" # 各季度代码行数
          SHOW_SHORT_INFO: "True" # 简短的趣闻信息
          SHOW_OS: "True" # 操作系统
          SHOW_PROJECTS: "False" # 项目（较占地方，按需开启）
          SHOW_TOTAL_CODE_TIME: "True" # 总编码时间
          SHOW_COMMIT: "True" # 提交信息
          SHOW_PROFILE_VIEWS: "True" # 主页访问量
          SHOW_DAYS_OF_WEEK: "True" # 按星期统计提交
          SHOW_LANGUAGE: "True" # 编码语言
          SHOW_EDITORS: "True" # 编辑器
          SHOW_LANGUAGE_PER_REPO: "True" # 仓库语言分布
          SYMBOL_VERSION: "2" # 进度条字符
